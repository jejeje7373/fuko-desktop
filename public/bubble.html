<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuko Dialogue</title>
    <style>
        :root {
            --bg: #07040d;
            --capri-pink: #ff2d6f;
            --capri-violet: #7b3fe4;
            --capri-cyan: #5ef6ff;
            --capri-green: #3dff8f;
            --muted: #a78ba9;
            --tab-h: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent !important;
            font-family: 'Share Tech Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace;
            padding: 3px;
        }

        /* Contenedor Capri Bubble */
        .bubble {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            color: #efe8ff;
            filter: drop-shadow(0 0 10px rgba(255, 45, 111, 0.4)) drop-shadow(0 0 6px rgba(94, 246, 255, 0.25));
        }

        /* Pestaña superior Cyberpunk (arrastrable) */
        .bubble__tab {
            position: relative;
            z-index: 2;
            width: 54%;
            height: var(--tab-h);
            padding: 4px 10px 4px 12px;
            background: rgba(7, 4, 13, 0.95);
            color: var(--capri-pink);
            clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 100%, 0 100%);
            box-shadow: inset 0 0 0 1px rgba(123, 63, 228, 0.85);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: grab;
        }

        .bubble__tab:active {
            cursor: grabbing;
        }

        .bubble__title {
            font-size: 9.5px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: 700;
            pointer-events: none;
        }

        .bubble__close-btn {
            background: transparent;
            border: none;
            color: var(--capri-pink);
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
            font-weight: 700;
            transition: transform 0.12s, color 0.12s;
        }

        .bubble__close-btn:hover {
            transform: scale(1.25);
            color: #fff;
        }

        /* Cuerpo principal de la placa Cyberpunk */
        .bubble__body {
            position: relative;
            margin-top: -1px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 12px 10px 12px;
            background: rgba(7, 4, 13, 0.94);
            box-shadow:
                inset 0 0 0 1px rgba(123, 63, 228, 0.85),
                0 0 14px rgba(255, 45, 111, 0.28);
            clip-path: polygon(
                0 0,
                54% 0,
                calc(54% + 16px) 0,
                100% 0,
                100% 100%,
                0 100%
            );
        }

        /* Brackets estilo HUD en las 4 esquinas */
        .bubble__brackets {
            pointer-events: none;
            position: absolute;
            inset: 4px 5px;
            background:
                linear-gradient(var(--capri-pink), var(--capri-pink)) top left / 10px 1.5px no-repeat,
                linear-gradient(var(--capri-pink), var(--capri-pink)) top left / 1.5px 10px no-repeat,
                linear-gradient(var(--capri-pink), var(--capri-pink)) top right / 10px 1.5px no-repeat,
                linear-gradient(var(--capri-pink), var(--capri-pink)) top right / 1.5px 10px no-repeat,
                linear-gradient(var(--capri-pink), var(--capri-pink)) bottom left / 10px 1.5px no-repeat,
                linear-gradient(var(--capri-pink), var(--capri-pink)) bottom left / 1.5px 10px no-repeat,
                linear-gradient(var(--capri-pink), var(--capri-pink)) bottom right / 10px 1.5px no-repeat,
                linear-gradient(var(--capri-pink), var(--capri-pink)) bottom right / 1.5px 10px no-repeat;
        }

        /* Scanlines CRT */
        .bubble__scan {
            pointer-events: none;
            position: absolute;
            inset: 0;
            opacity: 0.16;
            background: repeating-linear-gradient(
                0deg,
                transparent 0 2px,
                rgba(94, 246, 255, 0.14) 2px 3px
            );
        }

        /* Header con Logo oficial Capri y Badges */
        .bubble__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: grab;
            padding-bottom: 2px;
        }

        .bubble__logo {
            width: 24px;
            height: 24px;
            flex: none;
            background: #110816;
            clip-path: polygon(18% 0, 100% 0, 100% 82%, 82% 100%, 0 100%, 0 18%);
            border: 1px solid rgba(123, 63, 228, 0.7);
            pointer-events: none;
        }

        .bubble__logo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            clip-path: polygon(18% 0, 100% 0, 100% 82%, 82% 100%, 0 100%, 0 18%);
        }

        .bubble__meta {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .bubble__model {
            font-size: 9px;
            letter-spacing: 0.12em;
            color: var(--capri-cyan);
            text-transform: uppercase;
        }

        .bubble__badge {
            font-size: 9px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--capri-violet);
            font-weight: 700;
        }

        .bubble[data-state='LISTENING'] .bubble__badge { color: #e6c15a; }
        .bubble[data-state='THINKING'] .bubble__badge { color: var(--capri-pink); animation: blinkBadge 0.7s steps(2, jump-none) infinite; }
        .bubble[data-state='TALKING'] .bubble__badge { color: var(--capri-green); animation: blinkBadge 0.7s steps(2, jump-none) infinite; }
        .bubble[data-state='ONLINE'] .bubble__badge { color: var(--capri-cyan); }

        @keyframes blinkBadge {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.35; }
        }

        /* Línea de texto con máquina de escribir */
        .bubble__speech-area {
            flex: 1;
            min-height: 52px;
            max-height: 86px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: rgba(20, 10, 32, 0.6);
            border-left: 2px solid var(--capri-pink);
            padding: 5px 8px;
        }

        .bubble__speaker {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--capri-pink);
        }

        .bubble__line {
            font-size: 12px;
            line-height: 1.4;
            color: #f7efff;
            overflow-wrap: anywhere;
        }

        .bubble__cursor {
            display: inline-block;
            margin-left: 1px;
            color: var(--capri-pink);
            animation: blinkBadge 0.8s steps(2, jump-none) infinite;
        }

        /* Registro de interacción previo */
        .bubble__log {
            margin: 0;
            padding: 2px 0 0;
            list-style: none;
            max-height: 38px;
            overflow-y: auto;
            font-size: 9.5px;
            line-height: 1.35;
            letter-spacing: 0.03em;
            border-top: 1px dashed rgba(123, 63, 228, 0.4);
        }

        .bubble__row {
            margin: 0;
            overflow-wrap: anywhere;
        }
        .bubble__row.is-oido { color: var(--capri-green); }
        .bubble__row.is-pregunta { color: #e6c15a; }
        .bubble__row.is-fuko { color: var(--capri-cyan); }
        .bubble__row.is-sistema { color: #c9a6ff; }

        .bubble__tag {
            font-weight: 700;
            margin-right: 5px;
        }

        /* Prompt de entrada (> tú:) */
        .bubble__prompt {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-top: 4px;
            border-top: 1px solid rgba(123, 63, 228, 0.45);
            margin-top: auto;
        }

        .bubble__you {
            flex: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--capri-violet);
            pointer-events: none;
        }

        .bubble__field {
            flex: 1;
            min-width: 0;
            appearance: none;
            border: 0;
            padding: 3px 0;
            background: transparent;
            color: #fff;
            font-family: inherit;
            font-size: 11.5px;
            outline: none;
            user-select: text;
        }

        .bubble__field::placeholder {
            color: rgba(167, 139, 169, 0.55);
        }

        .bubble__mode-btn {
            flex: none;
            font-size: 8.5px;
            padding: 2px 6px;
            background: rgba(94, 246, 255, 0.14);
            border: 1px solid rgba(94, 246, 255, 0.5);
            color: var(--capri-cyan);
            cursor: pointer;
            letter-spacing: 0.08em;
            clip-path: polygon(3px 0, 100% 0, 100% calc(100% - 3px), calc(100% - 3px) 100%, 0 100%, 0 3px);
            transition: all 0.12s;
        }

        .bubble__mode-btn:hover {
            background: rgba(255, 45, 111, 0.25);
            border-color: var(--capri-pink);
            color: var(--capri-pink);
        }
    </style>
</head>
<body>

    <aside id="bubble" class="bubble" data-state="ONLINE">
        <!-- Pestaña draggable -->
        <div class="bubble__tab" data-tauri-drag-region>
            <span class="bubble__title" data-tauri-drag-region>FUKO.SYS // MENSAJE</span>
            <button class="bubble__close-btn" id="bubble-close-btn" title="Cerrar">×</button>
        </div>

        <div class="bubble__body">
            <div class="bubble__brackets" aria-hidden="true"></div>
            <div class="bubble__scan" aria-hidden="true"></div>

            <header class="bubble__head" data-tauri-drag-region>
                <figure class="bubble__logo" data-tauri-drag-region>
                    <img src="icons/capri.png" alt="Fuko / Capri">
                </figure>
                <div class="bubble__meta" data-tauri-drag-region>
                    <span class="bubble__model" id="bubble-model">⚡ AUTO</span>
                    <span class="bubble__badge bubble__state" id="bubble-state">EN ESPERA</span>
                </div>
            </header>

            <!-- Bloque de texto para Fuko -->
            <div class="bubble__speech-area">
                <span class="bubble__speaker">FUKO &gt;</span>
                <p class="bubble__line">
                    <span class="bubble__text" id="bubble-reply"></span><span class="bubble__cursor" id="bubble-caret" aria-hidden="true">▌</span>
                </p>
            </div>

            <!-- Registro de interacciones previas -->
            <ol class="bubble__log" id="bubble-log" aria-live="polite"></ol>

            <!-- Prompt de entrada -->
            <div class="bubble__prompt">
                <span class="bubble__you">TÚ &gt;</span>
                <input class="bubble__field" id="bubble-input" type="text" maxlength="500" placeholder="escribe algo… (Enter para enviar)" autocomplete="off" spellcheck="false">
                <span class="bubble__mode-btn" id="bubble-mode-pill" title="Click para alternar motor IA">⚡ AUTO</span>
            </div>
        </div>
    </aside>

    <script>
        const tauri = window.__TAURI__ || null;
        const invoke = tauri ? tauri.core.invoke : async () => ({});
        const listen = tauri ? tauri.event.listen : () => {};

        const bubbleEl = document.getElementById('bubble');
        const bubbleModel = document.getElementById('bubble-model');
        const bubbleState = document.getElementById('bubble-state');
        const bubbleReply = document.getElementById('bubble-reply');
        const bubbleCaret = document.getElementById('bubble-caret');
        const bubbleLog = document.getElementById('bubble-log');
        const bubbleInput = document.getElementById('bubble-input');
        const bubbleModePill = document.getElementById('bubble-mode-pill');
        const bubbleCloseBtn = document.getElementById('bubble-close-btn');

        const BRAIN_MODES = ['auto', 'argon', 'openclaw', 'ollama'];
        const BRAIN_LABELS = {
            auto: '⚡ AUTO',
            argon: '💎 GEMINI 4 ARGON',
            openclaw: '🦞 OPENCLAW',
            ollama: '🏠 OLLAMA'
        };
        let currentBrainMode = 'auto';

        let fullReplyText = '';
        let revealedChars = 0;
        let isThinking = false;
        let typeTimer = null;
        const CHARS_PER_SEC = 42;

        function addLogEntry(kind, text) {
            if (!bubbleLog || !text) return;
            const li = document.createElement('li');
            li.className = `bubble__row is-${kind}`;
            const tag = document.createElement('span');
            tag.className = 'bubble__tag';
            let label = '[TÚ]';
            if (kind === 'oido') label = '[OÍDO]';
            else if (kind === 'fuko') label = '[FUKO]';
            else if (kind === 'sistema') label = '[SISTEMA]';
            tag.textContent = label;
            const body = document.createElement('span');
            body.textContent = ` ${text}`;
            li.appendChild(tag);
            li.appendChild(body);
            bubbleLog.appendChild(li);
            while (bubbleLog.children.length > 4) {
                bubbleLog.removeChild(bubbleLog.firstChild);
            }
            bubbleLog.scrollTop = bubbleLog.scrollHeight;
        }

        function setBubbleState(stateName) {
            bubbleState.innerText = stateName;
            if (stateName === 'PENSANDO') bubbleEl.setAttribute('data-state', 'THINKING');
            else if (stateName === 'HABLANDO') bubbleEl.setAttribute('data-state', 'TALKING');
            else if (stateName === 'LISTENING') bubbleEl.setAttribute('data-state', 'LISTENING');
            else bubbleEl.setAttribute('data-state', 'ONLINE');
        }

        function startTypewriter(text, model = '') {
            clearInterval(typeTimer);
            isThinking = false;

            let clean = (text || '').trim();
            let moodMatch = clean.match(/^\[(burla|emocion|aburrida|seria)\]\s*/i);
            if (moodMatch) {
                clean = clean.replace(moodMatch[0], '');
            }

            if (model) {
                let badge = model;
                if (model.includes('argon')) badge = 'GEMINI 4 ARGON';
                else if (model.includes('nemotron')) badge = 'OPENCLAW NEMOTRON';
                else if (model.includes('bolt')) badge = 'OPENCLAW BOLT';
                else if (model.includes('skills')) badge = 'SKILLS+HANDS';
                bubbleModel.innerText = badge;
            }

            fullReplyText = clean;
            revealedChars = 0;
            bubbleReply.innerText = '';
            setBubbleState('HABLANDO');
            if (clean) addLogEntry('fuko', clean);

            const intervalMs = Math.round(1000 / CHARS_PER_SEC);
            typeTimer = setInterval(() => {
                revealedChars = Math.min(fullReplyText.length, revealedChars + 1);
                bubbleReply.innerText = fullReplyText.slice(0, revealedChars);
                if (revealedChars >= fullReplyText.length) {
                    clearInterval(typeTimer);
                    bubbleCaret.style.display = 'none';
                    setBubbleState('EN ESPERA');
                } else {
                    bubbleCaret.style.display = 'inline-block';
                }
            }, intervalMs);
        }

        async function submitUserMessage() {
            const text = bubbleInput.value.trim();
            if (!text || isThinking) return;
            bubbleInput.value = '';

            addLogEntry('pregunta', text);
            isThinking = true;
            setBubbleState('PENSANDO');
            bubbleReply.innerText = 'pensando...';
            bubbleCaret.style.display = 'inline-block';

            try {
                const res = await invoke('send_chat_message', {
                    message: text,
                    mode: currentBrainMode
                });
                startTypewriter(res.reply, res.model_used);
            } catch (err) {
                startTypewriter(`Mi cromo tuvo un glitch: ${err}`, 'error');
            }
        }

        bubbleInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitUserMessage();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                invoke('show_bubble_window_cmd', { show: false });
            }
        });

        bubbleCloseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            invoke('show_bubble_window_cmd', { show: false });
        });

        bubbleModePill.addEventListener('click', async (e) => {
            e.stopPropagation();
            const nextIdx = (BRAIN_MODES.indexOf(currentBrainMode) + 1) % BRAIN_MODES.length;
            currentBrainMode = BRAIN_MODES[nextIdx];
            bubbleModePill.innerText = BRAIN_LABELS[currentBrainMode] || '⚡ AUTO';
            try {
                await invoke('set_ai_mode_cmd', { mode: currentBrainMode });
            } catch (_) {}
        });

        // Eventos recibidos desde el avatar / sistema
        listen('avatar_speak', (e) => {
            const data = e.payload || {};
            const msg = typeof data === 'string' ? data : (data.message || '');
            const model = typeof data === 'object' ? (data.model || '') : '';
            const thinking = typeof data === 'object' ? !!data.thinking : false;
            const heard = typeof data === 'object' ? (data.heard || '') : '';

            if (heard) addLogEntry('pregunta', heard);

            if (thinking) {
                isThinking = true;
                setBubbleState('PENSANDO');
                bubbleReply.innerText = 'pensando...';
                bubbleCaret.style.display = 'inline-block';
            } else {
                startTypewriter(msg, model);
            }
        });

        listen('ears_speech_recognized', (e) => {
            const heard = String(e.payload || '').trim();
            if (heard) {
                addLogEntry('oido', heard);
                setBubbleState('PENSANDO');
            }
        });

        listen('focus_bubble_input', () => {
            setTimeout(() => bubbleInput.focus(), 60);
        });

        listen('ai_status_updated', (e) => {
            const st = e.payload || {};
            if (st.mode && BRAIN_MODES.includes(st.mode)) {
                currentBrainMode = st.mode;
                bubbleModePill.innerText = BRAIN_LABELS[currentBrainMode] || '⚡ AUTO';
            }
        });

        // Inicializar modo IA
        (async () => {
            try {
                const st = await invoke('get_ai_status_cmd');
                if (st && st.mode) {
                    currentBrainMode = st.mode;
                    bubbleModePill.innerText = BRAIN_LABELS[currentBrainMode] || '⚡ AUTO';
                }
            } catch (_) {}
        })();
    </script>
</body>
</html>
