<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Capri Dialogue</title>
  <style>
    :root {
      --bg: #07040d;
      --capri-pink: #ff2d6f;
      --capri-violet: #7b3fe4;
      --capri-cyan: #5ef6ff;
      --capri-green: #3dff8f;
      --muted: #a78ba9;
      --tab-h: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Share Tech Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      padding: 3px;
    }

    .bubble {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      color: #efe8ff;
      filter: drop-shadow(0 0 10px rgba(255, 45, 111, 0.35)) drop-shadow(0 0 6px rgba(94, 246, 255, 0.22));
    }

    .bubble__tab {
      position: relative;
      z-index: 2;
      width: 58%;
      height: var(--tab-h);
      padding: 4px 10px 4px 12px;
      background: rgba(7, 4, 13, 0.96);
      color: var(--capri-pink);
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 100%, 0 100%);
      border-top: 1px solid rgba(255, 45, 111, 0.7);
      border-left: 1px solid rgba(123, 63, 228, 0.85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .bubble__tab:active {
      cursor: grabbing;
    }

    .bubble__close-btn {
      background: transparent;
      border: 1px solid rgba(255, 45, 111, 0.45);
      color: var(--capri-pink);
      font-family: inherit;
      font-size: 10px;
      line-height: 1;
      padding: 1px 5px;
      cursor: pointer;
      margin-right: 8px;
    }

    .bubble__close-btn:hover {
      background: var(--capri-pink);
      color: #07040d;
    }

    .bubble__body {
      position: relative;
      margin-top: -1px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 12px 10px 12px;
      background: rgba(7, 4, 13, 0.95);
      border: 1px solid rgba(123, 63, 228, 0.85);
      box-shadow: inset 0 0 14px rgba(123, 63, 228, 0.25), 0 0 14px rgba(255, 45, 111, 0.25);
    }

    .bubble__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(123, 63, 228, 0.35);
      cursor: grab;
    }

    .bubble__meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      font-size: 10px;
      letter-spacing: 0.06em;
    }

    .bubble__model {
      color: var(--capri-cyan);
      font-weight: 700;
      text-transform: uppercase;
    }

    .bubble__badge {
      padding: 1px 6px;
      font-size: 9.5px;
      font-weight: 700;
      border: 1px solid var(--capri-green);
      color: var(--capri-green);
      background: rgba(61, 255, 143, 0.1);
      text-transform: uppercase;
    }

    .bubble[data-state="PENSANDO"] .bubble__badge {
      border-color: var(--capri-cyan);
      color: var(--capri-cyan);
      background: rgba(94, 246, 255, 0.12);
    }

    .bubble[data-state="HABLANDO"] .bubble__badge {
      border-color: var(--capri-pink);
      color: var(--capri-pink);
      background: rgba(255, 45, 111, 0.14);
    }

    /* Area principal de respuesta de Capri: siempre visible y con scroll propio */
    .bubble__speech-area {
      flex: 1;
      width: 100%;
      min-height: 74px;
      max-height: 122px;
      overflow-y: auto;
      padding: 6px 10px;
      background: rgba(16, 10, 30, 0.85);
      border-left: 2px solid var(--capri-pink);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .bubble__speaker {
      font-size: 10px;
      font-weight: 700;
      color: var(--capri-pink);
      letter-spacing: 0.06em;
    }

    .bubble__line {
      font-size: 13px;
      line-height: 1.42;
      color: #ffffff;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      user-select: text;
    }

    .bubble__text {
      color: #ffffff;
    }

    .bubble__noise {
      color: var(--capri-cyan);
      opacity: 0.75;
    }

    .bubble__cursor {
      display: inline-block;
      margin-left: 2px;
      color: var(--capri-pink);
      font-weight: 700;
      animation: blinkCursor 0.75s steps(2, jump-none) infinite;
    }

    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .bubble__log {
      margin: 0;
      padding: 3px 0 0;
      list-style: none;
      max-height: 40px;
      overflow-y: auto;
      font-size: 9.5px;
      line-height: 1.35;
      letter-spacing: 0.02em;
      border-top: 1px dashed rgba(123, 63, 228, 0.4);
      color: var(--muted);
    }

    .bubble__row {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bubble__row.is-fuko .bubble__tag {
      color: var(--capri-pink);
      font-weight: 700;
    }

    .bubble__row.is-pregunta .bubble__tag,
    .bubble__row.is-oido .bubble__tag {
      color: var(--capri-cyan);
      font-weight: 700;
    }

    .bubble__prompt {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: rgba(18, 12, 34, 0.95);
      border: 1px solid rgba(94, 246, 255, 0.45);
    }

    .bubble__you {
      font-size: 11px;
      font-weight: 700;
      color: var(--capri-cyan);
      white-space: nowrap;
    }

    .bubble__field {
      flex: 1;
      min-width: 0;
      appearance: none;
      border: 0;
      background: transparent;
      color: #ffffff;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      user-select: text;
    }

    .bubble__mode-btn {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--capri-cyan);
      border: 1px solid rgba(94, 246, 255, 0.5);
      padding: 2px 6px;
      cursor: pointer;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .bubble__mode-btn:hover {
      border-color: var(--capri-pink);
      color: var(--capri-pink);
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--capri-violet);
    }
  </style>
</head>
<body>
  <aside id="bubble" class="bubble" data-state="ONLINE">
    <div class="bubble__tab" data-tauri-drag-region>
      <span class="bubble__title" data-tauri-drag-region>FUKO.SYS // DIALOGO</span>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="bubble-settings-btn" title="Configurar Conexiones (OpenClaw & Antigravity)" style="background:transparent; border:none; color:var(--accent); cursor:pointer; font-size:12px; line-height:1; padding:0 2px;">⚙️</button>
        <button class="bubble__close-btn" id="bubble-close-btn" title="Cerrar">X</button>
      </div>
    </div>

    <div class="bubble__body">
      <header class="bubble__head" data-tauri-drag-region>
        <div class="bubble__meta" data-tauri-drag-region>
          <span class="bubble__model" id="bubble-model">[AUTO: OPENCLAW + ANTIGRAVITY]</span>
          <span class="bubble__badge" id="bubble-state">EN ESPERA</span>
        </div>
      </header>

      <div class="bubble__speech-area" id="bubble-speech-area">
        <span class="bubble__speaker">CAPRI &gt;</span>
        <p class="bubble__line">
          <span class="bubble__text" id="bubble-reply">Lista. Escribe o habla cuando quieras.</span><span class="bubble__noise" id="bubble-noise"></span><span class="bubble__cursor" id="bubble-caret">_</span>
        </p>
      </div>

      <ol class="bubble__log" id="bubble-log" aria-live="polite"></ol>

      <form id="bubble-form" class="bubble__prompt" action="javascript:void(0);">
        <span class="bubble__you">TU &gt;</span>
        <input class="bubble__field" id="bubble-input" type="text" maxlength="500" placeholder="escribe a Capri y presiona Enter..." autocomplete="off" />
        <span class="bubble__mode-btn" id="bubble-mode-pill" title="Click para cambiar motor IA">AUTO</span>
      </form>
    </div>
  </aside>

  <script>
    function getTauri() {
      return window.__TAURI__ || null;
    }

    async function invoke(cmd, args = {}) {
      const t = window.__TAURI__;
      if (t && t.core && typeof t.core.invoke === 'function') {
        return await t.core.invoke(cmd, args);
      }
      if (t && typeof t.invoke === 'function') {
        return await t.invoke(cmd, args);
      }
      for (let i = 0; i < 20; i++) {
        await new Promise(r => setTimeout(r, 50));
        const t2 = window.__TAURI__;
        if (t2 && t2.core && typeof t2.core.invoke === 'function') {
          return await t2.core.invoke(cmd, args);
        }
        if (t2 && typeof t2.invoke === 'function') {
          return await t2.invoke(cmd, args);
        }
      }
      console.error('[Tauri IPC] window.__TAURI__ no disponible para invocar:', cmd);
      throw new Error('Canal IPC de Tauri no disponible.');
    }

    function listen(event, handler) {
      const attach = () => {
        const t = window.__TAURI__;
        if (t && t.event && typeof t.event.listen === 'function') {
          t.event.listen(event, handler);
          return true;
        }
        return false;
      };
      if (!attach()) {
        let count = 0;
        const timer = setInterval(() => {
          count++;
          if (attach() || count > 30) clearInterval(timer);
        }, 80);
      }
    }

    async function emit(event, payload) {
      const t = window.__TAURI__;
      if (t && t.event && typeof t.event.emit === 'function') {
        return await t.event.emit(event, payload);
      }
      for (let i = 0; i < 15; i++) {
        await new Promise(r => setTimeout(r, 60));
        const t2 = window.__TAURI__;
        if (t2 && t2.event && typeof t2.event.emit === 'function') {
          return await t2.event.emit(event, payload);
        }
      }
    }

    const bubble = document.getElementById('bubble');
    const bubbleCloseBtn = document.getElementById('bubble-close-btn');
    const bubbleSettingsBtn = document.getElementById('bubble-settings-btn');
    const bubbleModel = document.getElementById('bubble-model');
    const bubbleState = document.getElementById('bubble-state');
    const bubbleSpeechArea = document.getElementById('bubble-speech-area');
    const bubbleReply = document.getElementById('bubble-reply');
    const bubbleNoise = document.getElementById('bubble-noise');
    const bubbleCaret = document.getElementById('bubble-caret');
    const bubbleLog = document.getElementById('bubble-log');
    const bubbleInput = document.getElementById('bubble-input');
    const bubbleModePill = document.getElementById('bubble-mode-pill');

    const BRAIN_MODES = ['auto', 'antigravity', 'openclaw', 'ollama'];
    const BRAIN_LABELS = {
      auto: 'AUTO',
      antigravity: 'ANTIGRAVITY',
      openclaw: 'OPENCLAW',
      ollama: 'OLLAMA'
    };
    let currentBrainMode = 'auto';

    // =========================================================================
    // 1. SINTETIZADOR RETRO DE SONIDO CAPRI-DESKTOP (Port exacto de MtGhozt/Capri-Desktop voice.js)
    // Cero voz humana: usa bleeps pentatónicos de 3 osciladores al hablar y al responder por texto
    // =========================================================================
    const BLIP_NOTES = [62, 65, 67, 69, 72, 74, 77, 79]; // Escala pentatónica La menor (MIDI)
    const NOISE_CHARS = '...#$%&\\<>01XZ';

    class CapriSynthVoice {
      constructor() {
        this.ctx = null;
        this.master = null;
        this.enabled = true;
        this.lastBlip = 0;
      }

      ensureCtx() {
        if (!this.enabled) return null;
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          this.ctx = new AudioCtx();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.85;
          this.master.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }

      midiToFreq(m) {
        return 440 * Math.pow(2, (m - 69) / 12);
      }

      osc(type, freq, startTime, dur, peak) {
        const c = this.ensureCtx();
        if (!c || !this.master) return;
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, startTime);
        g.gain.setValueAtTime(0.0001, startTime);
        g.gain.linearRampToValueAtTime(peak, startTime + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
        o.connect(g);
        g.connect(this.master);
        o.start(startTime);
        o.stop(startTime + dur + 0.005);
      }

      // Sonido al teclear tú en la barra de texto (typeBlip de MtGhozt/Capri-Desktop)
      typeBlip() {
        const c = this.ensureCtx();
        if (!c) return;
        const freq = 600 + Math.random() * 300;
        this.osc('square', freq, c.currentTime, 0.028, 0.055);
      }

      // Sonido no-humano de Capri al escribir cada letra de su respuesta (blip de MtGhozt/Capri-Desktop)
      blip(mood = 'normal') {
        const now = performance.now();
        if (now - this.lastBlip < 45) return;
        this.lastBlip = now;
        const c = this.ensureCtx();
        if (!c) return;

        let note = BLIP_NOTES[Math.floor(Math.random() * BLIP_NOTES.length)];
        if (mood === 'alert' || mood === 'emocion') note += 5;
        else if (mood === 'error' || mood === 'aburrida') note -= 5;

        const f = this.midiToFreq(note);
        const t = c.currentTime;
        // 1) Fundamental (square)
        this.osc('square', f, t, 0.036, 0.042);
        // 2) Quinta justa arriba (triangle, +4ms)
        this.osc('triangle', f * 1.498, t + 0.004, 0.030, 0.030);
        // 3) Octava abajo (square, +8ms)
        this.osc('square', f * 0.501, t + 0.008, 0.030, 0.022);
      }

      // Arpegio cuando Capri empieza a responderte (para que sepas al instante que ya respondió)
      replyStartArp() {
        const c = this.ensureCtx();
        if (!c) return;
        const notes = [659, 784, 988, 1318]; // E5, G5, B5, E6 (wakeArp de Capri-Desktop)
        const t = c.currentTime;
        notes.forEach((freq, i) => {
          this.osc('square', freq, t + i * 0.052, 0.05, 0.065);
        });
      }

      // Chime corto al terminar de escribir la respuesta (done de Capri-Desktop)
      replyDoneChime() {
        const c = this.ensureCtx();
        if (!c) return;
        const t = c.currentTime;
        this.osc('triangle', 880, t, 0.07, 0.05);
        this.osc('triangle', 1174.66, t + 0.06, 0.09, 0.055);
      }

      errorBuzz() {
        const c = this.ensureCtx();
        if (!c) return;
        const t = c.currentTime;
        this.osc('sawtooth', 190, t, 0.12, 0.07);
        this.osc('square', 145, t + 0.09, 0.16, 0.07);
      }
    }

    const capriSynth = new CapriSynthVoice();

    // Desbloquear Web Audio en cualquier interacción
    window.addEventListener('pointerdown', () => capriSynth.ensureCtx());
    window.addEventListener('keydown', () => capriSynth.ensureCtx());

    // =========================================================================
    // 2. LIMPIEZA DE EMOJIS Y ETIQUETAS (Regla de MtGhozt/Capri-Desktop: CERO emojis)
    // =========================================================================
    function stripEmojisAndTags(raw) {
      if (!raw) return { clean: '', mood: 'normal' };
      let text = String(raw);

      let mood = 'normal';
      if (/\[(burla|grin)\]/i.test(text)) mood = 'burla';
      else if (/\[(emocion|dance|alert)\]/i.test(text)) mood = 'emocion';
      else if (/\[(aburrida|sad|dangle)\]/i.test(text)) mood = 'aburrida';
      else if (/\[(seria|idle)\]/i.test(text)) mood = 'seria';

      // Quitar etiquetas de ánimo y etiquetas de acción [ACTION: ...] / [open:...] / [play:...]
      text = text
        .replace(/\[(burla|emocion|aburrida|seria|grin|dance|idle)\]/gi, '')
        .replace(/\[ACTION:[^\]]*\]/gi, '')
        .replace(/\[(open|play):[^\]]*\]/gi, '');

      // Eliminar cualquier emoji Unicode
      text = text.replace(/[\p{Extended_Pictographic}\p{Emoji_Presentation}\uFE0F\u200D]/gu, '');
      return { clean: text.replace(/\s+/g, ' ').trim(), mood };
    }

    function setBubbleState(st) {
      bubble.dataset.state = st;
      bubbleState.innerText = st;
      if (st === 'PENSANDO') {
        setPortraitFace('aside');
      } else if (st === 'EN ESPERA') {
        setPortraitFace('calm');
      }
    }

    function addLogEntry(kind, rawText) {
      const { clean } = stripEmojisAndTags(rawText);
      if (!bubbleLog || !clean) return;
      // Evitar duplicar la misma línea consecutiva en el log
      if (bubbleLog.lastElementChild && bubbleLog.lastElementChild.dataset.raw === `${kind}:${clean}`) {
        return;
      }
      const li = document.createElement('li');
      li.className = `bubble__row is-${kind}`;
      li.dataset.raw = `${kind}:${clean}`;
      const tag = document.createElement('span');
      tag.className = 'bubble__tag';
      let label = '[TU]';
      if (kind === 'oido') label = '[VOZ]';
      else if (kind === 'fuko') label = '[CAPRI]';
      else if (kind === 'sistema') label = '[SYS]';
      tag.textContent = label;
      const body = document.createElement('span');
      body.textContent = ` ${clean}`;
      li.appendChild(tag);
      li.appendChild(body);
      bubbleLog.appendChild(li);
      while (bubbleLog.children.length > 4) {
        bubbleLog.removeChild(bubbleLog.firstChild);
      }
      bubbleLog.scrollTop = bubbleLog.scrollHeight;
    }

    // =========================================================================
    // 3. EFECTO TYPEWRITER + GLITCH DECODE EXACTO DE MtGhozt/Capri-Desktop (bubble.js)
    // =========================================================================
    let typeTimer = null;
    let isThinking = false;
    let lastRenderedSignature = '';
    let lastRenderedAt = 0;

    function randomNoiseString(len) {
      let out = '';
      for (let i = 0; i < len; i++) {
        out += NOISE_CHARS[Math.floor(Math.random() * NOISE_CHARS.length)];
      }
      return out;
    }

    function startTypewriter(rawText, model = '') {
      const { clean, mood } = stripEmojisAndTags(rawText);
      const finalMsg = clean || 'Listo.';

      // Deduplicación para impedir que eventos repetidos reinicien o borren el texto
      const now = performance.now();
      const sig = `${model}|${finalMsg}`;
      if (sig === lastRenderedSignature && (now - lastRenderedAt) < 600) {
        return;
      }
      lastRenderedSignature = sig;
      lastRenderedAt = now;

      if (typeTimer) {
        clearTimeout(typeTimer);
        typeTimer = null;
      }
      isThinking = false;

      const cleanModel = model ? stripEmojisAndTags(model).clean.toUpperCase() : 'CAPRI';
      bubbleModel.innerText = model === 'error' ? '[ERROR]' : `[${BRAIN_LABELS[model] || cleanModel || 'CAPRI'}]`;

      setBubbleState('HABLANDO');
      const lower = finalMsg.toLowerCase();
      let face = 'smug';
      if (lower.includes('jaja') || lower.includes('haha') || lower.includes('heh')) {
        face = 'laugh';
      } else if (finalMsg.includes('?') || finalMsg.includes('¿')) {
        face = 'wide';
      } else if (lower.includes('error') || model === 'error') {
        face = 'wide';
      } else if (lower.includes('tontito') || lower.includes('choom') || lower.includes('bueno') || mood === 'burla') {
        face = 'smug';
      } else {
        face = 'look';
      }

      // Notificar a overlay_window para que asome la expresión desde arriba
      emit('capri_peek_expression', {
        face: face,
        reason: 'speaking',
        hint: `[CAPRI // ${face.toUpperCase()}]`,
        duration_ms: Math.max(4500, finalMsg.length * 45)
      });
      addLogEntry('fuko', finalMsg);

      // Notificar al avatar en index.html para que sincronice la boca y gesto sin reenviar avatar_speak
      emit('capri_mouth_sync', { length: finalMsg.length, mood });

      // Sonar arpegio de notificación de respuesta
      if (model === 'error') {
        capriSynth.errorBuzz();
      } else {
        capriSynth.replyStartArp();
      }

      let idx = 0;
      bubbleReply.textContent = '';
      bubbleNoise.textContent = '';
      bubbleCaret.style.display = 'inline-block';

      function stepChar() {
        if (idx >= finalMsg.length) {
          bubbleReply.textContent = finalMsg;
          bubbleNoise.textContent = '';
          bubbleCaret.style.display = 'none';
          setBubbleState('EN ESPERA');
          capriSynth.replyDoneChime();
          typeTimer = null;
          return;
        }

        idx++;
        const ch = finalMsg[idx - 1];
        bubbleReply.textContent = finalMsg.slice(0, idx);

        // Ruido de decodificación estilo Capri-Desktop (hasta 5 caracteres adelante)
        const remaining = finalMsg.length - idx;
        const noiseLen = Math.min(5, remaining);
        bubbleNoise.textContent = noiseLen > 0 ? randomNoiseString(noiseLen) : '';
        bubbleSpeechArea.scrollTop = bubbleSpeechArea.scrollHeight;

        if (ch && ch.trim().length > 0) {
          capriSynth.blip(mood);
        }

        // Pausas adaptativas por puntuación (idéntico a bubble.js de MtGhozt/Capri-Desktop)
        let delay = 28;
        if (finalMsg.slice(idx - 3, idx) === '...') {
          delay = 190;
        } else if (ch === '.' || ch === '!' || ch === '?') {
          delay = 105;
        } else if (ch === ',' || ch === ';' || ch === ':') {
          delay = 70;
        }

        typeTimer = setTimeout(stepChar, delay);
      }

      stepChar();
    }

    async function submitUserMessage() {
      const text = bubbleInput.value.trim();
      if (!text) return;
      bubbleInput.value = '';

      addLogEntry('pregunta', text);
      isThinking = true;
      if (typeTimer) {
        clearTimeout(typeTimer);
        typeTimer = null;
      }
      setBubbleState('PENSANDO');
      try {
        emit('capri_peek_expression', {
          face: 'aside',
          reason: 'thinking',
          hint: '[CAPRI // PENSANDO...]',
          duration_ms: 12000
        });
      } catch (_) {}
      bubbleReply.textContent = 'pensando...';
      bubbleNoise.textContent = '...';
      bubbleCaret.style.display = 'inline-block';

      if (window.__thinkingSafetyTimer) clearTimeout(window.__thinkingSafetyTimer);
      window.__thinkingSafetyTimer = setTimeout(() => {
        isThinking = false;
        if (bubbleReply.textContent.startsWith('pensando')) {
          setBubbleState('EN ESPERA');
          bubbleCaret.style.display = 'none';
        }
      }, 45000);

      try {
        const res = await invoke('send_chat_message', {
          message: text,
          mode: currentBrainMode
        });
        if (window.__thinkingSafetyTimer) {
          clearTimeout(window.__thinkingSafetyTimer);
          window.__thinkingSafetyTimer = null;
        }
        if (res && res.reply) {
          startTypewriter(res.reply, res.model_used || currentBrainMode);
        } else {
          startTypewriter('Sin respuesta del motor.', 'error');
        }
      } catch (err) {
        if (window.__thinkingSafetyTimer) {
          clearTimeout(window.__thinkingSafetyTimer);
          window.__thinkingSafetyTimer = null;
        }
        startTypewriter(`Fallo en la conexion: ${err}`, 'error');
      } finally {
        isThinking = false;
      }
    }

    const bubbleForm = document.getElementById('bubble-form');
    if (bubbleForm) {
      bubbleForm.addEventListener('submit', (e) => {
        e.preventDefault();
        submitUserMessage();
      });
    }

    bubbleInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        invoke('show_bubble_window_cmd', { show: false });
        return;
      }
      if (e.key === 'Enter' || e.code === 'Enter' || e.keyCode === 13) {
        e.preventDefault();
        submitUserMessage();
        return;
      }
      if (e.key && e.key.length === 1) {
        capriSynth.typeBlip();
      }
    });

    bubbleCloseBtn.addEventListener('click', () => {
      invoke('show_bubble_window_cmd', { show: false });
    });

    if (bubbleSettingsBtn) {
      bubbleSettingsBtn.addEventListener('click', () => {
        invoke('open_mainframe_cmd');
      });
    }

    bubbleModePill.addEventListener('click', async () => {
      const idx = (BRAIN_MODES.indexOf(currentBrainMode) + 1) % BRAIN_MODES.length;
      currentBrainMode = BRAIN_MODES[idx];
      bubbleModePill.innerText = BRAIN_LABELS[currentBrainMode];
      bubbleModel.innerText = `[${BRAIN_LABELS[currentBrainMode]}]`;
      try {
        await invoke('set_ai_mode_cmd', { mode: currentBrainMode });
      } catch (_) {}
    });

    // Evento limpio desde index.html o desde el backend de Rust
    function handleIncomingSpeech(payload) {
      const data = payload || {};
      const msg = typeof data === 'string' ? data : (data.message || data.reply || '');
      const model = typeof data === 'object' ? (data.model || '') : '';
      const thinking = typeof data === 'object' ? !!data.thinking : false;
      const heard = typeof data === 'object' ? (data.heard || '') : '';

      if (heard && heard !== 'startup' && !heard.startsWith('(')) {
        addLogEntry('pregunta', heard);
      }

      if (thinking) {
        isThinking = true;
        setBubbleState('PENSANDO');
        bubbleReply.textContent = stripEmojisAndTags(msg).clean || 'pensando';
        bubbleNoise.textContent = '...';
        bubbleCaret.style.display = 'inline-block';
        if (window.__thinkingSafetyTimer) clearTimeout(window.__thinkingSafetyTimer);
        window.__thinkingSafetyTimer = setTimeout(() => {
          isThinking = false;
          if (bubbleReply.textContent === 'pensando' || bubbleReply.textContent === 'pensando...') {
            setBubbleState('EN ESPERA');
            bubbleCaret.style.display = 'none';
          }
        }, 45000);
      } else if (msg) {
        if (window.__thinkingSafetyTimer) {
          clearTimeout(window.__thinkingSafetyTimer);
          window.__thinkingSafetyTimer = null;
        }
        startTypewriter(msg, model);
      }
    }

    listen('capri_bubble_render', (e) => handleIncomingSpeech(e.payload));
    listen('avatar_speak', (e) => handleIncomingSpeech(e.payload));

    listen('ears_speech_recognized', (e) => {
      const txt = typeof e.payload === 'string' ? e.payload : (e.payload?.text || '');
      if (txt) {
        addLogEntry('oido', txt);
        setBubbleState('PENSANDO');
        bubbleReply.textContent = 'procesando voz';
        bubbleNoise.textContent = '...';
      }
    });

    listen('focus_bubble_input', () => {
      setTimeout(() => {
        bubbleInput.focus();
        bubbleInput.select();
      }, 50);
    });

    window.addEventListener('focus', () => {
      try { invoke('focus_bubble_window_cmd'); } catch (_) {}
      setTimeout(() => bubbleInput.focus(), 50);
    });

    document.addEventListener('mousedown', (e) => {
      try { invoke('focus_bubble_window_cmd'); } catch (_) {}
      if (e.target !== bubbleCloseBtn && e.target !== bubbleSettingsBtn && e.target !== bubbleModePill) {
        setTimeout(() => bubbleInput.focus(), 10);
      }
    });

    document.addEventListener('click', (e) => {
      try { invoke('focus_bubble_window_cmd'); } catch (_) {}
      if (e.target !== bubbleCloseBtn && e.target !== bubbleSettingsBtn && e.target !== bubbleModePill) {
        bubbleInput.focus();
      }
    });

    bubbleInput.addEventListener('focus', () => {
      try { invoke('focus_bubble_window_cmd'); } catch (_) {}
    });

    listen('ai_status_updated', (e) => {
      const st = e.payload;
      if (st && st.mode) {
        currentBrainMode = st.mode;
        bubbleModePill.innerText = BRAIN_LABELS[currentBrainMode] || currentBrainMode.toUpperCase();
      }
    });

    (async () => {
      try {
        const st = await invoke('get_ai_status_cmd');
        if (st && st.mode) {
          currentBrainMode = st.mode;
          bubbleModePill.innerText = BRAIN_LABELS[currentBrainMode] || currentBrainMode.toUpperCase();
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
